services:
  - type: web
    name: carestream-four
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carestream-four-db
          property: connectionString
databases:
  - name: carestream-four-db
    plan: free
    region: singapore
    ipAllowList: []
